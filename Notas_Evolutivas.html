<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Notas Evolutivas</title>
    <style>
        * { box-sizing: border-box; font-family: 'Times New Roman', Times, serif; }
        body { background-color: #f2f2f2; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; color: #000; }
        
        .page { 
            background: #ffffff; 
            width: 210mm; 
            min-height: 297mm; 
            padding: 18mm 20mm 15mm 20mm; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15); 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }
        
        .content-area { flex-grow: 1; }
        
        /* Membrete */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 15px; }
        .header-logo { max-width: 160px; max-height: 75px; object-fit: contain; }
        .header-info { text-align: center; flex-grow: 1; }
        .header-info h2 { margin: 0; font-size: 14pt; font-weight: bold; text-transform: uppercase; }
        .header-info h3 { margin: 2px 0 4px 0; font-size: 11pt; font-weight: normal; }
        .header-info p { margin: 1px 0; font-size: 9.5pt; font-weight: bold; }
        
        /* Datos del Paciente */
        .patient-info { width: 100%; margin-bottom: 12px; font-size: 10pt; line-height: 1.4; }
        .patient-grid { display: grid; grid-template-columns: 1.2fr 1fr; row-gap: 3px; column-gap: 20px; }
        .divider { border-bottom: 1.5px solid #000; margin: 10px 0 15px 0; }
        
        /* Título */
        .report-title { text-align: center; font-size: 13pt; font-weight: bold; text-decoration: underline; margin: 10px 0 20px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Línea de Tiempo de Notas */
        .timeline-container { position: relative; padding-left: 18px; border-left: 2px solid #333; margin-left: 5px; }
        
        .evolution-note { 
            position: relative; 
            margin-bottom: 20px; 
            padding-bottom: 5px; 
            page-break-inside: avoid; /* Evita cortes feos al imprimir en PDF */
        }
        
        .evolution-note::before {
            content: '';
            position: absolute;
            left: -24.5px;
            top: 2px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background-color: #000;
            border: 2px solid #fff;
        }

        .note-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background-color: #f4f4f4; 
            padding: 4px 8px; 
            border-left: 3px solid #000;
            margin-bottom: 6px;
            font-size: 10pt;
        }
        
        .note-date { font-weight: bold; font-size: 10.5pt; }
        
        .note-body { 
            font-size: 10pt; 
            line-height: 1.45; 
            text-align: justify; 
            white-space: pre-wrap; 
            padding: 0 4px;
        }

        /* Pie de página */
        .footer { border-top: 1px solid #000; padding-top: 8px; margin-top: 20px; text-align: center; font-size: 8.5pt; line-height: 1.3; color: #222; }
        .footer p { margin: 2px 0; }

        /* Botón de Impresión */
        .action-buttons { margin-top: 25px; margin-bottom: 30px; display: flex; gap: 15px; justify-content: center; }
        .btn { background-color: #1d5f99; color: #ffffff; border: none; padding: 10px 22px; font-size: 11pt; font-weight: bold; border-radius: 4px; cursor: pointer; font-family: Arial, sans-serif; }
        .btn:hover { background-color: #14436d; }
        
        @media print {
            body { background: none; padding: 0; }
            .page { box-shadow: none; width: 100%; padding: 0; min-height: auto; }
            .action-buttons { display: none !important; }
            @page { size: A4; margin: 15mm; }
        }
    </style>
</head>
<body>

    <div class="page" id="diario-content">
        <div class="content-area">
            <!-- MEMBRETE -->
            <div class="header">
                <div style="width: 160px;">
                    <img src="https://lh3.googleusercontent.com/d/1BsnSEM4G0mbZg5j9JeOWayP6t4RknZFW" alt="Logo" class="header-logo">
                </div>
                <div class="header-info">
                    <h2 id="field-Titulo">MEDICINA FÍSICA Y REHABILITACIÓN</h2>
                    <h3 id="field-Subtitulo"></h3>
                    <p><span id="field-Medico-tratante"></span> <span id="field-Especialidad-Medica"></span></p>
                </div>
            </div>

            <!-- DATOS DEL PACIENTE -->
            <div class="patient-info">
                <div class="patient-grid">
                    <div><strong>Paciente:</strong> <span id="val-Nombre-y-Apellido"></span></div>
                    <div><strong>Edad:</strong> <span id="val-Edad"></span></div>
                    <div><strong>C.I:</strong> <span id="val-Cedula"></span></div>
                    <div><strong>F / N:</strong> <span id="val-FN"></span></div>
                    <div><strong>Telf:</strong> <span id="val-Telefono"></span></div>
                    <div><strong>Aseguradora:</strong> <span id="val-Aseguradora"></span></div>
                </div>
            </div>

            <div class="divider"></div>
            <div class="report-title">Historial de Notas Evolutivas</div>

            <!-- CONTENEDOR DE LAS NOTAS -->
            <div class="timeline-container" id="container-notas"></div>
        </div>

        <!-- PIE DE PÁGINA -->
        <div class="footer" id="sec-Footer">
            <p id="field-Direccion"></p>
            <p><span id="field-Telefonos"></span> | <span id="field-Correo"></span></p>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn" onclick="window.print()">Imprimir / Guardar en PDF</button>
    </div>

    <script>
        function obtenerParametros() {
            const params = {};
            const queryString = window.location.search.substring(1);
            const pairs = queryString.split("&");
            for (let i = 0; i < pairs.length; i++) {
                if (!pairs[i]) continue;
                const pair = pairs[i].split("=");
                const key = decodeURIComponent(pair[0].replace(/\+/g, " ")).trim();
                const value = decodeURIComponent((pair[1] || "").replace(/\+/g, " ")).trim();
                params[key] = value;
            }
            return params;
        }

        function formatearFechaLatina(fechaStr) {
            if (!fechaStr) return '';
            let partes = fechaStr.split(/[-/]/);
            if (partes[0].length === 4) return `${partes[2].padStart(2, '0')}/${partes[1].padStart(2, '0')}/${partes[0]}`;
            if (partes.length === 3 && partes[2].length === 4) return `${partes[1].padStart(2, '0')}/${partes[0].padStart(2, '0')}/${partes[2]}`;
            return fechaStr;
        }

        window.onload = function() {
            const p = obtenerParametros();

            // Cargar datos de la cabecera
            if (p['Titulo']) document.getElementById('field-Titulo').innerText = p['Titulo'];
            if (p['Subtitulo']) document.getElementById('field-Subtitulo').innerText = p['Subtitulo'];
            if (p['Medico tratante']) document.getElementById('field-Medico-tratante').innerText = p['Medico tratante'];
            if (p['Especialidad Medica']) document.getElementById('field-Especialidad-Medica').innerText = ' - ' + p['Especialidad Medica'];

            // Datos del Paciente
            document.getElementById('val-Nombre-y-Apellido').innerText = p['Nombre y Apellido'] || '';
            document.getElementById('val-Cedula').innerText = p['Cedula'] || '';
            document.getElementById('val-Edad').innerText = p['Edad'] || '';
            document.getElementById('val-FN').innerText = p['FN'] ? formatearFechaLatina(p['FN']) : (p['F / N'] ? formatearFechaLatina(p['F / N']) : '');
            document.getElementById('val-Telefono').innerText = p['Telefono'] || '';
            document.getElementById('val-Aseguradora').innerText = p['Aseguradora'] || '';
            document.getElementById('field-Direccion').innerText = p['Direccion'] || '';
            document.getElementById('field-Telefonos').innerText = p['Numero de telefono principal'] || '';
            document.getElementById('field-Correo').innerText = p['Correo electronico'] || '';

            // Renderizado de las Notas Evolutivas
            const container = document.getElementById('container-notas');

            if (p['NotasEvolutivas']) {
                const bloques = p['NotasEvolutivas'].split('||');
                let htmlNotas = '';

                bloques.forEach(b => {
                    if (!b.trim()) return;
                    const partes = b.split('::');
                    const fecha = partes[0] ? partes[0].trim() : '';
                    const texto = partes[1] ? partes[1].trim() : b.trim();

                    htmlNotas += `
                        <div class="evolution-note">
                            <div class="note-header">
                                <span class="note-date">📅 Fecha: ${formatearFechaLatina(fecha)}</span>
                            </div>
                            <div class="note-body">${texto}</div>
                        </div>
                    `;
                });

                container.innerHTML = htmlNotas;
            } else {
                container.innerHTML = '<p style="font-style:italic; font-size:10pt;">No hay notas evolutivas registradas para este paciente.</p>';
            }
        };
    </script>
</body>
</html>
